<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spintec AI Quantum Engine v5 - 2 Predicciones Ultra-Precisa</title>
  <style>
    :root {
      --bg-dark: #080d1a;
      --card-bg: #111827;
      --accent-gold: #fbbf24;
      --accent-cyan: #06b6d4;
      --accent-purple: #a855f7;
      --green-spintec: #10b981;
      --red-spintec: #ef4444;
      --black-spintec: #374151;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: #f8fafc;
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 950px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }

    @media (min-width: 850px) {
      .container { grid-template-columns: 2fr 1fr; }
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      border: 1px solid #1f2937;
    }

    h2 {
      margin-top: 0;
      color: var(--accent-gold);
      font-size: 0.95rem;
      border-bottom: 1px solid #374151;
      padding-bottom: 8px;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Selector de Fuente */
    .wheel-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .btn-source {
      flex: 1;
      padding: 8px;
      border: 1px solid #374151;
      background: #1f2937;
      color: #9ca3af;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.8rem;
    }

    .btn-source.active {
      background: var(--accent-cyan);
      color: #000;
      border-color: var(--accent-cyan);
    }

    /* Grid de Solo 2 Predicciones Máximas */
    .predictions-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 15px 0;
    }

    .pred-card {
      background: #030712;
      border: 2px solid var(--accent-gold);
      border-radius: 10px;
      padding: 12px 5px;
      text-align: center;
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.2);
    }

    .pred-card.hotspot-boost {
      border-color: var(--accent-purple);
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
    }

    .pred-card .number {
      font-size: 2.4rem;
      font-weight: 900;
      color: var(--accent-gold);
    }

    .pred-card.hotspot-boost .number {
      color: var(--accent-purple);
    }

    .pred-card .confidence {
      font-size: 0.85rem;
      color: var(--accent-cyan);
      font-weight: bold;
      margin-top: 2px;
    }

    .pred-card .reason {
      font-size: 0.7rem;
      color: #9ca3af;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.1;
      margin-top: 4px;
    }

    /* Modificador Hotspot con x90 añadido */
    .hotspot-controls {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #1f2937;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 12px;
      overflow-x: auto;
    }

    .hotspot-controls label {
      font-size: 0.75rem;
      color: var(--accent-purple);
      font-weight: bold;
      white-space: nowrap;
    }

    .hotspot-btn {
      padding: 5px 8px;
      font-size: 0.75rem;
      border-radius: 4px;
      border: none;
      background: #374151;
      color: #fff;
      cursor: pointer;
    }

    .hotspot-btn.selected {
      background: var(--accent-purple);
      font-weight: bold;
    }

    /* Teclado Táctil */
    .keypad {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    .key {
      background: var(--black-spintec);
      color: #fff;
      border: none;
      padding: 10px 0;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    .key:active { transform: scale(0.95); }
    .key.red { background-color: var(--red-spintec); }
    .key.black { background-color: var(--black-spintec); }
    .key.green { background-color: var(--green-spintec); }

    /* Historial con resaltado en DORADO */
    .history-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 170px;
      overflow-y: auto;
      padding: 5px;
    }

    .badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.85rem;
      box-sizing: border-box;
    }

    /* ESTILO DORADO DE ACIERTO PREDECIDO */
    .badge.hit-gold {
      background: linear-gradient(135deg, #f59e0b, #fbbf24, #d97706) !important;
      color: #000 !important;
      font-weight: 900;
      border: 2px solid #fff;
      box-shadow: 0 0 10px #fbbf24, 0 0 15px #f59e0b;
      transform: scale(1.1);
    }

    .hot-list {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .hot-badge {
      background: #374151;
      border: 1px solid var(--accent-gold);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      color: var(--accent-gold);
    }

    .btn-clear {
      background: #dc2626;
      color: white;
      border: none;
      padding: 10px;
      width: 100%;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Panel Principal -->
  <div class="card">
    <h2>
      Top 2 Jugadas Máxima Precisión (Spintec v5)
      <span style="font-size: 0.7rem; color: var(--accent-cyan);" id="data-count">Entradas: 0</span>
    </h2>

    <!-- Seleccionar Ruleta -->
    <div class="wheel-selector">
      <button class="btn-source active" id="btn-fisica" onclick="setFuente('Física')">Ruleta Física (Soplador)</button>
      <button class="btn-source" id="btn-virtual" onclick="setFuente('Virtual')">Ruleta Virtual (RNG)</button>
    </div>

    <!-- Solo 2 Predicciones -->
    <div class="predictions-grid">
      <div class="pred-card" id="card1">
        <div class="number" id="pred1">-</div>
        <div class="confidence" id="conf1">0%</div>
        <div class="reason" id="reason1">Sin datos</div>
      </div>
      <div class="pred-card" id="card2">
        <div class="number" id="pred2">-</div>
        <div class="confidence" id="conf2">0%</div>
        <div class="reason" id="reason2">Sin datos</div>
      </div>
    </div>

    <!-- Modificador de Hotspot con x90 añadido -->
    <div class="hotspot-controls">
      <label>Hotspot:</label>
      <button class="hotspot-btn selected" onclick="setMult('x1')" id="m1">Normal</button>
      <button class="hotspot-btn" onclick="setMult('x30')" id="m30">x30</button>
      <button class="hotspot-btn" onclick="setMult('x60')" id="m60">x60</button>
      <button class="hotspot-btn" onclick="setMult('x90')" id="m90">x90</button>
      <button class="hotspot-btn" onclick="setMult('x150')" id="m150">x150</button>
      <button class="hotspot-btn" onclick="setMult('x300')" id="m300">x300</button>
    </div>

    <h2>Teclado Tactil (Americana 0/00)</h2>
    <div class="keypad" id="keypad"></div>
  </div>

  <!-- Panel Lateral -->
  <div class="card">
    <h2>Frecuencias Calientes</h2>
    <div class="hot-list" id="hotNumbers">
      <span style="font-size: 0.75rem; color: #64748b;">Analizando...</span>
    </div>

    <h2 style="margin-top: 15px;">Historial (Aciertos en Dorado)</h2>
    <div class="history-list" id="history"></div>

    <button class="btn-clear" onclick="limpiarHistorial()">Reiniciar Todo</button>
  </div>
</div>

<script>
  // Rueda Americana Oficial Spintec
  const ruedaAmericana = [
    "0", "28", "9", "26", "30", "11", "7", "20", "32", "17", 
    "5", "22", "34", "15", "3", "24", "36", "13", "1", "00", 
    "27", "10", "25", "29", "12", "8", "19", "31", "18", "6", 
    "21", "33", "16", "4", "23", "35", "14", "2"
  ];

  const rojos = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];
  let historial = [];
  let fuenteRuleta = "Física";
  let multiplicadorActual = "x1";
  let ultimasPredicciones = [];

  function initUI() {
    const keypad = document.getElementById('keypad');
    const botones = ["0", "00", ...Array.from({length: 36}, (_, i) => (i + 1).toString())];

    botones.forEach(num => {
      const btn = document.createElement('button');
      btn.innerText = num;
      btn.className = 'key ' + getClaseColor(num);
      btn.onclick = () => agregarNumero(num);
      keypad.appendChild(btn);
    });
  }

  function setFuente(tipo) {
    fuenteRuleta = tipo;
    document.getElementById('btn-fisica').classList.toggle('active', tipo === 'Física');
    document.getElementById('btn-virtual').classList.toggle('active', tipo === 'Virtual');
    ejecutarMotorIA();
  }

  function setMult(val) {
    multiplicadorActual = val;
    ["1", "30", "60", "90", "150", "300"].forEach(m => {
      document.getElementById(`m${m}`).classList.toggle('selected', `x${m}` === val || (m==='1' && val==='x1'));
    });
  }

  function getClaseColor(num) {
    if (num === "0" || num === "00") return "green";
    return rojos.includes(Number(num)) ? "red" : "black";
  }

  function agregarNumero(num) {
    // Comprobar si el número ingresado acertó una de las predicciones dadas
    let fueAcierto = ultimasPredicciones.includes(num);

    historial.push({ 
      num: num, 
      fuente: fuenteRuleta, 
      mult: multiplicadorActual,
      acierto: fueAcierto 
    });

    setMult('x1');
    actualizarHistorialUI();
    ejecutarMotorIA();
  }

  function actualizarHistorialUI() {
    const historyDiv = document.getElementById('history');
    historyDiv.innerHTML = '';
    
    [...historial].reverse().forEach(item => {
      const badge = document.createElement('div');
      
      if (item.acierto) {
        badge.className = `badge hit-gold`; // RESALTADO DORADO DE ACIERTO
        badge.title = "¡Acierto de la IA!";
      } else {
        badge.className = `badge ${getClaseColor(item.num)}`;
        if (item.mult !== 'x1') {
          badge.style.border = "2px solid var(--accent-purple)";
        }
      }
      
      badge.innerText = item.num;
      historyDiv.appendChild(badge);
    });

    document.getElementById('data-count').innerText = `Entradas: ${historial.length}`;
    calcularHotNumbers();
  }

  function calcularHotNumbers() {
    let conteo = {};
    historial.forEach(item => {
      conteo[item.num] = (conteo[item.num] || 0) + 1;
    });

    let ordenados = Object.keys(conteo).sort((a,b) => conteo[b] - conteo[a]).slice(0, 3);
    const hotDiv = document.getElementById('hotNumbers');
    
    if (ordenados.length === 0) {
      hotDiv.innerHTML = '<span style="font-size: 0.75rem; color: #64748b;">Sin datos...</span>';
      return;
    }

    hotDiv.innerHTML = '';
    ordenados.forEach(num => {
      hotDiv.innerHTML += `<div class="hot-badge">🔥 ${num} (${conteo[num]}x)</div>`;
    });
  }

  function limpiarHistorial() {
    historial = [];
    ultimasPredicciones = [];
    actualizarHistorialUI();
    for(let i = 1; i <= 2; i++) {
      document.getElementById(`pred${i}`).innerText = '-';
      document.getElementById(`conf${i}`).innerText = '0%';
      document.getElementById(`reason${i}`).innerText = 'Sin datos';
      document.getElementById(`card${i}`).classList.remove('hotspot-boost');
    }
  }

  // MOTOR IA QUANTUM DE SÓLO 2 PREDICCIONES
  function ejecutarMotorIA() {
    if (historial.length === 0) return;

    let candidatos = {};

    function sumarPuntos(num, puntos, motivo) {
      if (!candidatos[num]) candidatos[num] = { peso: 0, motivos: [] };
      candidatos[num].peso += puntos;
      if (!candidatos[num].motivos.includes(motivo)) candidatos[num].motivos.push(motivo);
    }

    const len = historial.length;
    const ultimoObj = historial[len - 1];
    const ultimo = ultimoObj.num;

    // 1. CÁLCULO BIOMECÁNICO DEL SOPLADOR (Delta)
    let deltasFrecuentes = {};
    if (len >= 3) {
      for (let i = 1; i < len; i++) {
        let idxPrev = ruedaAmericana.indexOf(historial[i-1].num);
        let idxCurr = ruedaAmericana.indexOf(historial[i].num);
        if (idxPrev !== -1 && idxCurr !== -1) {
          let delta = Math.abs(idxCurr - idxPrev);
          if (delta > 19) delta = 38 - delta;
          deltasFrecuentes[delta] = (deltasFrecuentes[delta] || 0) + 1;
        }
      }
    }

    let idxUltimo = ruedaAmericana.indexOf(ultimo);
    if (idxUltimo !== -1) {
      Object.keys(deltasFrecuentes).forEach(deltaStr => {
        let d = Number(deltaStr);
        let pesoDelta = deltasFrecuentes[deltaStr] * 25;

        let posA = (idxUltimo + d) % ruedaAmericana.length;
        let posB = (idxUltimo - d + ruedaAmericana.length) % ruedaAmericana.length;

        sumarPuntos(ruedaAmericana[posA], pesoDelta, `Eje biomecánico ±${d}`);
        sumarPuntos(ruedaAmericana[posB], pesoDelta, `Eje biomecánico ±${d}`);
      });
    }

    // 2. PESOS POR MULTIPLICADORES (x30, x60, x90, x150, x300)
    historial.forEach(item => {
      if (item.mult !== 'x1') {
        let multVal = Number(item.mult.replace('x', ''));
        sumarPuntos(item.num, multVal / 3, `Acumulación Hotspot ${item.mult}`);
      }
    });

    // 3. DISTRIBUCIÓN GAUSSIANA DEL SECTOR
    if (idxUltimo !== -1) {
      for (let offset = -4; offset <= 4; offset++) {
        if (offset === 0) continue;
        let pos = (idxUltimo + offset + ruedaAmericana.length) % ruedaAmericana.length;
        let dist = Math.abs(offset);
        let pwr = (fuenteRuleta === "Física") ? (35 - dist * 6) : (20 - dist * 4);
        sumarPuntos(ruedaAmericana[pos], pwr, `Pico Gaussiano (${dist} pos)`);
      }
    }

    // 4. CADENAS MARKOV AVANZADAS
    if (len >= 2) {
      const prev = historial[len - 2].num;
      for (let i = 0; i < len - 2; i++) {
        if (historial[i].num === prev && historial[i + 1].num === ultimo) {
          sumarPuntos(historial[i + 2].num, 40, `Patrón Markov [${prev}->${ultimo}]`);
        }
      }
    }

    // Excluir el número actual de salir repetido de inmediato
    delete candidatos[ultimo];

    // Ordenar los mejores candidatos
    let listaOrdenada = Object.keys(candidatos).map(key => ({
      num: key,
      peso: candidatos[key].peso,
      motivo: candidatos[key].motivos[0] || "Pico de masa"
    })).sort((a, b) => b.peso - a.peso);

    const respaldo = ["0", "00", "17", "23", "5", "10"];
    let elegidos = [];
    let setElegidos = new Set();

    for (let item of listaOrdenada) {
      if (!setElegidos.has(item.num)) {
        setElegidos.add(item.num);
        elegidos.push(item);
      }
      if (elegidos.length === 2) break; // SOLO 2 PREDICCIONES
    }

    while (elegidos.length < 2) {
      let r = respaldo.shift();
      if (!setElegidos.has(r) && r !== ultimo) {
        setElegidos.add(r);
        elegidos.push({ num: r, peso: 12, motivo: "Inercia de mesa" });
      }
    }

    // Guardar las 2 predicciones para verificar aciertos futuros
    ultimasPredicciones = elegidos.map(e => e.num);

    let totalPeso = elegidos.reduce((acc, curr) => acc + curr.peso, 0);

    // Pintar las 2 tarjetas principales
    for (let i = 0; i < 2; i++) {
      let conf = Math.min(Math.round((elegidos[i].peso / (totalPeso || 1)) * 100) + 20, 96);
      document.getElementById(`pred${i+1}`).innerText = elegidos[i].num;
      document.getElementById(`conf${i+1}`).innerText = `${conf}% Conf.`;
      document.getElementById(`reason${i+1}`).innerText = elegidos[i].motivo;

      const card = document.getElementById(`card${i+1}`);
      if (elegidos[i].motivo.includes('Hotspot') || elegidos[i].motivo.includes('Markov')) {
        card.classList.add('hotspot-boost');
      } else {
        card.classList.remove('hotspot-boost');
      }
    }
  }

  initUI();
</script>

</body>
</html>
