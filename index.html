<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analizador de Patrones - Spinte Roulette</title>
  <style>
    :root {
      --bg-dark: #121826;
      --card-bg: #1f293d;
      --accent-gold: #fbbf24;
      --green-spin: #10b981;
      --red-spin: #ef4444;
      --black-spin: #1f2937;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: #f3f4f6;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 768px) {
      .container {
        grid-template-columns: 2fr 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    h2 {
      margin-top: 0;
      color: var(--accent-gold);
      font-size: 1.2rem;
      border-bottom: 1px solid #374151;
      padding-bottom: 10px;
    }

    /* Teclado de Ruleta */
    .keypad {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }

    .key {
      background: #374151;
      color: #fff;
      border: none;
      padding: 12px 0;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }

    .key:active {
      transform: scale(0.95);
    }

    .key.red { background-color: var(--red-spin); }
    .key.black { background-color: var(--black-spin); }
    .key.green { background-color: var(--green-spin); }

    /* Predicciones */
    .predictions {
      display: flex;
      justify-content: space-around;
      margin: 15px 0;
    }

    .pred-box {
      background: #111827;
      border: 2px solid var(--accent-gold);
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      width: 25%;
    }

    .pred-box .number {
      font-size: 2rem;
      font-weight: bold;
      color: var(--accent-gold);
    }

    .pred-box .reason {
      font-size: 0.75rem;
      color: #9ca3af;
      margin-top: 5px;
    }

    /* Historial */
    .history-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 120px;
      overflow-y: auto;
      padding: 5px;
    }

    .badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .btn-clear {
      background: #ef4444;
      color: white;
      border: none;
      padding: 10px;
      width: 100%;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Panel Principal: Entrada y Predicciones -->
  <div class="card">
    <h2>Predicción de Algoritmo Spinte</h2>
    <p style="font-size: 0.85rem; color: #9ca3af;">Ingresa los números conforme van saliendo en la pantalla:</p>
    
    <div class="predictions">
      <div class="pred-box">
        <div class="number" id="pred1">-</div>
        <div class="reason" id="reason1">Esperando datos</div>
      </div>
      <div class="pred-box">
        <div class="number" id="pred2">-</div>
        <div class="reason" id="reason2">Esperando datos</div>
      </div>
      <div class="pred-box">
        <div class="number" id="pred3">-</div>
        <div class="reason" id="reason3">Esperando datos</div>
      </div>
    </div>

    <h2>Ingreso Rápido de Números</h2>
    <div class="keypad" id="keypad"></div>
  </div>

  <!-- Panel Lateral: Historial y Control -->
  <div class="card">
    <h2>Historial de Partida</h2>
    <div class="history-list" id="history"></div>
    <button class="btn-clear" onclick="limpiarHistorial()">Reiniciar Sesión</button>
  </div>
</div>

<script>
  // Orden físico en la rueda americana (incluye 0 y 00)
  const ruedaAmericana = ["0", "28", "9", "26", "30", "11", "7", "20", "32", "17", "5", "22", "34", "15", "3", "24", "36", "13", "1", "00", "27", "10", "25", "29", "12", "8", "19", "31", "18", "6", "21", "33", "16", "4", "23", "35", "14", "2"];
  
  const rojos = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];
  let historial = [];

  // Inicializar teclado interactivo
  function initKeypad() {
    const keypad = document.getElementById('keypad');
    const botones = ["0", "00", ...Array.from({length: 36}, (_, i) => (i + 1).toString())];

    botones.forEach(num => {
      const btn = document.createElement('button');
      btn.innerText = num;
      btn.className = 'key ' + getClaseColor(num);
      btn.onclick = () => agregarNumero(num);
      keypad.appendChild(btn);
    });
  }

  function getClaseColor(num) {
    if (num === "0" || num === "00") return "green";
    return rojos.includes(Number(num)) ? "red" : "black";
  }

  function agregarNumero(num) {
    historial.push(num);
    actualizarHistorialUI();
    calcularPredicciones();
  }

  function actualizarHistorialUI() {
    const historyDiv = document.getElementById('history');
    historyDiv.innerHTML = '';
    
    [...historial].reverse().forEach(num => {
      const badge = document.createElement('div');
      badge.className = `badge ${getClaseColor(num)}`;
      badge.innerText = num;
      historyDiv.appendChild(badge);
    });
  }

  function limpiarHistorial() {
    historial = [];
    actualizarHistorialUI();
    document.getElementById('pred1').innerText = '-';
    document.getElementById('pred2').innerText = '-';
    document.getElementById('pred3').innerText = '-';
    document.getElementById('reason1').innerText = 'Esperando datos';
    document.getElementById('reason2').innerText = 'Esperando datos';
    document.getElementById('reason3').innerText = 'Esperando datos';
  }

  // Motor de cálculo de patrones
  function calcularPredicciones() {
    if (historial.length === 0) return;

    const ultimo = historial[historial.length - 1];
    let sugerencias = [];

    // 1. Patrón de Múltiplos y Mitades (Regla Spinte)
    if (!isNaN(ultimo) && ultimo !== "0" && ultimo !== "00") {
      let val = Number(ultimo);
      if (val * 2 <= 36) sugerencias.push({ num: (val * 2).toString(), motivo: `Doble de ${val}` });
      if (val * 3 <= 36) sugerencias.push({ num: (val * 3).toString(), motivo: `Triple de ${val}` });
      if (val % 2 === 0) sugerencias.push({ num: (val / 2).toString(), motivo: `Mitad de ${val}` });
    }

    // 2. Patrón de Espejo / Inversión de dígitos
    if (ultimo.length === 2 && ultimo !== "00") {
      let espejo = ultimo.split('').reverse().join('');
      if (Number(espejo) <= 36) {
        sugerencias.push({ num: espejo, motivo: `Espejo de ${ultimo}` });
      }
    }

    // 3. Patrón de Vecinos en la Rueda Física
    let idx = ruedaAmericana.indexOf(ultimo);
    if (idx !== -1) {
      let izq = ruedaAmericana[(idx - 1 + ruedaAmericana.length) % ruedaAmericana.length];
      let der = ruedaAmericana[(idx + 1) % ruedaAmericana.length];
      sugerencias.push({ num: izq, motivo: `Vecino plato (${ultimo})` });
      sugerencias.push({ num: der, motivo: `Vecino plato (${ultimo})` });
    }

    // Filtrar candidatos repetidos
    let unicos = [];
    let mapa = new Set();
    
    for (let item of sugerencias) {
      if (!mapa.has(item.num) && item.num !== ultimo) {
        mapa.add(item.num);
        unicos.push(item);
      }
    }

    // Rellenar con números por defecto si no se completan 3 sugerencias
    const respaldo = [{num: "7", motivo: "Frecuencia base"}, {num: "17", motivo: "Frecuencia base"}, {num: "23", motivo: "Frecuencia base"}];
    while (unicos.length < 3) {
      let r = respaldo.shift();
      if (!mapa.has(r.num)) {
        unicos.push(r);
      }
    }

    // Renderizar las 3 sugerencias principales
    for (let i = 0; i < 3; i++) {
      document.getElementById(`pred${i+1}`).innerText = unicos[i].num;
      document.getElementById(`reason${i+1}`).innerText = unicos[i].motivo;
    }
  }

  // Inicializar al cargar la página
  initKeypad();
</script>

</body>
</html>
