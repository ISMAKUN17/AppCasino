<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spintec AI Pattern Engine - Ruleta Americana</title>
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: #151d30;
      --accent-gold: #fbbf24;
      --accent-cyan: #38bdf8;
      --green-spintec: #10b981;
      --red-spintec: #ef4444;
      --black-spintec: #334155;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: #f8fafc;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 950px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }

    @media (min-width: 768px) {
      .container { grid-template-columns: 2fr 1fr; }
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      border: 1px solid #1e293b;
    }

    h2 {
      margin-top: 0;
      color: var(--accent-gold);
      font-size: 1rem;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Grid de las 4 Predicciones */
    .predictions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 15px 0;
    }

    .pred-box {
      background: #070a12;
      border: 2px solid var(--accent-gold);
      border-radius: 8px;
      padding: 10px 4px;
      text-align: center;
    }

    .pred-box .number {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent-gold);
    }

    .pred-box .confidence {
      font-size: 0.75rem;
      color: var(--accent-cyan);
      font-weight: bold;
      margin-top: 2px;
    }

    .pred-box .reason {
      font-size: 0.65rem;
      color: #94a3b8;
      margin-top: 4px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Teclado Táctil */
    .keypad {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .key {
      background: var(--black-spintec);
      color: #fff;
      border: none;
      padding: 12px 0;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    .key:active { transform: scale(0.95); }
    .key.red { background-color: var(--red-spintec); }
    .key.black { background-color: var(--black-spintec); }
    .key.green { background-color: var(--green-spintec); }

    /* Historial */
    .history-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
      padding: 5px;
    }

    .badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.85rem;
    }

    .status-bar {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 10px;
    }

    .btn-clear {
      background: #dc2626;
      color: white;
      border: none;
      padding: 10px;
      width: 100%;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Panel Principal -->
  <div class="card">
    <h2>
      Top 4 Jugadas Sugeridas (IA Spintec)
      <span style="font-size: 0.7rem; color: var(--accent-cyan);" id="data-count">Entradas: 0</span>
    </h2>
    
    <div class="predictions">
      <div class="pred-box">
        <div class="number" id="pred1">-</div>
        <div class="confidence" id="conf1">0%</div>
        <div class="reason" id="reason1">Esperando tiradas</div>
      </div>
      <div class="pred-box">
        <div class="number" id="pred2">-</div>
        <div class="confidence" id="conf2">0%</div>
        <div class="reason" id="reason2">Esperando tiradas</div>
      </div>
      <div class="pred-box">
        <div class="number" id="pred3">-</div>
        <div class="confidence" id="conf3">0%</div>
        <div class="reason" id="reason3">Esperando tiradas</div>
      </div>
      <div class="pred-box">
        <div class="number" id="pred4">-</div>
        <div class="confidence" id="conf4">0%</div>
        <div class="reason" id="reason4">Esperando tiradas</div>
      </div>
    </div>

    <h2>Teclado Tactil (Americana 0/00)</h2>
    <div class="keypad" id="keypad"></div>
  </div>

  <!-- Panel Lateral -->
  <div class="card">
    <h2>Historial & Estado IA</h2>
    <div class="history-list" id="history"></div>
    <div class="status-bar" id="status">Esperando primeros números para calibrar algoritmos de Markov...</div>
    <button class="btn-clear" onclick="limpiarHistorial()">Reiniciar Partida</button>
  </div>
</div>

<script>
  // Rueda Americana Oficial Spintec (38 casillas)
  const ruedaAmericana = [
    "0", "28", "9", "26", "30", "11", "7", "20", "32", "17", 
    "5", "22", "34", "15", "3", "24", "36", "13", "1", "00", 
    "27", "10", "25", "29", "12", "8", "19", "31", "18", "6", 
    "21", "33", "16", "4", "23", "35", "14", "2"
  ];

  const rojos = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];
  let historial = [];

  function initKeypad() {
    const keypad = document.getElementById('keypad');
    const botones = ["0", "00", ...Array.from({length: 36}, (_, i) => (i + 1).toString())];

    botones.forEach(num => {
      const btn = document.createElement('button');
      btn.innerText = num;
      btn.className = 'key ' + getClaseColor(num);
      btn.onclick = () => agregarNumero(num);
      keypad.appendChild(btn);
    });
  }

  function getClaseColor(num) {
    if (num === "0" || num === "00") return "green";
    return rojos.includes(Number(num)) ? "red" : "black";
  }

  function agregarNumero(num) {
    historial.push(num);
    actualizarHistorialUI();
    ejecutarMotorIA();
  }

  function actualizarHistorialUI() {
    const historyDiv = document.getElementById('history');
    historyDiv.innerHTML = '';
    
    [...historial].reverse().forEach(num => {
      const badge = document.createElement('div');
      badge.className = `badge ${getClaseColor(num)}`;
      badge.innerText = num;
      historyDiv.appendChild(badge);
    });

    document.getElementById('data-count').innerText = `Entradas: ${historial.length}`;
  }

  function limpiarHistorial() {
    historial = [];
    actualizarHistorialUI();
    for(let i = 1; i <= 4; i++) {
      document.getElementById(`pred${i}`).innerText = '-';
      document.getElementById(`conf${i}`).innerText = '0%';
      document.getElementById(`reason${i}`).innerText = 'Esperando tiradas';
    }
    document.getElementById('status').innerText = 'Partida reiniciada.';
  }

  // MOTOR DE IA Y DETECCIÓN DE PATRONES
  function ejecutarMotorIA() {
    if (historial.length === 0) return;

    let candidatos = {}; // Map para acumular pesos/puntuaciones de cada número

    function sumarPuntos(num, puntos, motivo) {
      if (!candidatos[num]) {
        candidatos[num] = { peso: 0, motivos: [] };
      }
      candidatos[num].peso += puntos;
      if (!candidatos[num].motivos.includes(motivo)) {
        candidatos[num].motivos.push(motivo);
      }
    }

    const len = historial.length;
    const ultimo = historial[len - 1];

    // 1. ANÁLISIS DE MARKOV (Secuencias de 2 y 3 números)
    if (len >= 2) {
      const prev = historial[len - 2];
      // Buscar coincidencia de pares previos en la historia [prev, ultimo] -> ?
      for (let i = 0; i < len - 2; i++) {
        if (historial[i] === prev && historial[i + 1] === ultimo) {
          let siguienteEfectivo = historial[i + 2];
          sumarPuntos(siguienteEfectivo, 40, `Patrón de secuencia [${prev}, ${ultimo}]`);
        }
      }
    }

    if (len >= 1) {
      // Buscar coincidencia simple de transición [ultimo] -> ?
      for (let i = 0; i < len - 1; i++) {
        if (historial[i] === ultimo) {
          let sig = historial[i + 1];
          sumarPuntos(sig, 20, `Transición histórica tras el ${ultimo}`);
        }
      }
    }

    // 2. ARITMÉTICA Y MULTIPLICACIÓN (Reglas Spintec)
    if (ultimo !== "0" && ultimo !== "00") {
      let val = Number(ultimo);
      if (val * 2 <= 36) sumarPuntos((val * 2).toString(), 15, `Doble de ${val}`);
      if (val * 3 <= 36) sumarPuntos((val * 3).toString(), 15, `Triple de ${val}`);
      if (val % 2 === 0) sumarPuntos((val / 2).toString(), 15, `Mitad de ${val}`);
    }

    // Ceros opuestos (Especial Spintec Americana)
    if (ultimo === "0") sumarPuntos("00", 25, "Respuesta a cero opuesto");
    if (ultimo === "00") sumarPuntos("0", 25, "Respuesta a cero opuesto");

    // Espejo
    if (ultimo.length === 2 && ultimo !== "00") {
      let espejo = ultimo.split('').reverse().join('');
      if (Number(espejo) <= 36) sumarPuntos(espejo, 12, `Inversión espejo de ${ultimo}`);
    }

    // 3. SECTOR FÍSICO Y VECINOS EN EL PLATO
    let idx = ruedaAmericana.indexOf(ultimo);
    if (idx !== -1) {
      let izq = ruedaAmericana[(idx - 1 + ruedaAmericana.length) % ruedaAmericana.length];
      let der = ruedaAmericana[(idx + 1) % ruedaAmericana.length];
      sumarPuntos(izq, 18, `Vecino plato (${ultimo})`);
      sumarPuntos(der, 18, `Vecino plato (${ultimo})`);
    }

    // 4. EVITAR EL ÚLTIMO NÚMERO (Salvo repetición extrema)
    delete candidatos[ultimo];

    // Ordenar candidatos por puntuación
    let listaOrdenada = Object.keys(candidatos).map(key => ({
      num: key,
      peso: candidatos[key].peso,
      motivo: candidatos[key].motivos.join(" + ")
    })).sort((a, b) => b.peso - a.peso);

    // Rellenar si faltan opciones
    const respaldo = [
      {num: "0", motivo: "Protección 0"}, 
      {num: "00", motivo: "Protección 00"}, 
      {num: "17", motivo: "Centro plato"}, 
      {num: "23", motivo: "Frecuencia base"}
    ];

    let elegidos = [];
    let setElegidos = new Set();

    for (let item of listaOrdenada) {
      if (!setElegidos.has(item.num)) {
        setElegidos.add(item.num);
        elegidos.push(item);
      }
      if (elegidos.length === 4) break;
    }

    while (elegidos.length < 4) {
      let r = respaldo.shift();
      if (!setElegidos.has(r.num) && r.num !== ultimo) {
        setElegidos.add(r.num);
        elegidos.push({ num: r.num, peso: 10, motivo: r.motivo });
      }
    }

    // Renderizar las 4 mejores jugadas en interfaz
    let totalPeso = elegidos.reduce((acc, curr) => acc + curr.peso, 0);

    for (let i = 0; i < 4; i++) {
      let conf = Math.min(Math.round((elegidos[i].peso / (totalPeso || 1)) * 100) + 20, 95);
      document.getElementById(`pred${i+1}`).innerText = elegidos[i].num;
      document.getElementById(`conf${i+1}`).innerText = `${conf}% Conf.`;
      document.getElementById(`reason${i+1}`).innerText = elegidos[i].motivo;
    }

    document.getElementById('status').innerText = `IA calibrada con ${len} tiradas. Secuencias de Markov activas.`;
  }

  initKeypad();
</script>

</body>
</html>
